[package]
name = "disk-calculator"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "DC — Disk Calculator: консольный анализ заполнения папки по метаданным"
license = "MIT"
readme = "README.md"

[[bin]]
name = "dc"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
